spring.application.name=libraryapp

# Reuses the MySQL container defined in mysqldb/compose.yaml (MYSQL_DATABASE=appdb,
# MYSQL_USER=appuser, MYSQL_PASSWORD=apppassword). Run `docker compose up -d` in that
# folder before starting this app.
spring.datasource.url=jdbc:mysql://localhost:3306/appdb
spring.datasource.username=appuser
spring.datasource.password=apppassword

# Demo-friendly persistence: schema is rebuilt and reseeded from data.sql on every
# restart, so you always start from a known, readable dataset while exploring the app.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

server.port=8080

# turn off banner
spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.luv2code.libraryapp=info
